# Type Path Mode User Group Age Argument
d /var/lib/hardened-blikvm-gadget 0750 root hardened-blikvm - -
# The download worker, in no shared group, may only pass through to read the
# administration switches (admin-features.json, 0644).
a+ /var/lib/hardened-blikvm-gadget - - - - u:hardened-blikvm-download:--x
# The images directory is the mount point of the MSD partition. The server user
# needs traversal here and write access inside it (upload, delete); the journal
# files below are root-only regardless.
d /var/lib/hardened-blikvm-gadget/images 0770 root hardened-blikvm - -
# The media catalog is operator-visible control-plane state that the server
# writes (mount/upload/delete), so the server user owns it. The catalog rejects
# group- or world-writable paths, so the mode stays 0755/0640.
d /etc/hardened-blikvm-gadget 0755 hardened-blikvm-server hardened-blikvm - -
z /etc/hardened-blikvm-gadget/catalog.json 0640 hardened-blikvm-server hardened-blikvm - -
