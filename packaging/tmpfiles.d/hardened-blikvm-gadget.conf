# Type Path Mode User Group Age Argument
d /var/lib/hardened-blikvm-gadget 0750 root hardened-blikvm - -
# The download worker, in no shared group, may only pass through to read the
# administration switches (admin-features.json, 0644).
a+ /var/lib/hardened-blikvm-gadget - - - - u:hardened-blikvm-download:--x
# The images directory is the mount point of the MSD partition. The server user
# needs traversal here and write access inside it (upload, delete); the journal
# files below are root-only regardless.
d /var/lib/hardened-blikvm-gadget/images 0770 root hardened-blikvm - -
# The media catalog is operator-visible state that the server writes (upload,
# remote download, delete) in a directory of its own; the board owner reads
# it through the group. The catalog rejects group- or world-writable paths.
d /var/lib/hardened-blikvm-gadget/catalog 0750 hardened-blikvm-server hardened-blikvm - -
# It lived in /etc/hardened-blikvm-gadget until the security review of
# 2026-10-18 (CRIT-01): copied from there once, when it is not here yet. A
# new card's image keeps its empty catalog there for this copy.
C /var/lib/hardened-blikvm-gadget/catalog/catalog.json - hardened-blikvm-server hardened-blikvm - /etc/hardened-blikvm-gadget/catalog.json
# The root board owner and boardd read their configuration here (atx.env,
# system-action.env, boardd.json, serial): root's, its files root's and 0640,
# whatever the web server's account, which owned the directory, left.
d /etc/hardened-blikvm-gadget 0755 root hardened-blikvm - -
z /etc/hardened-blikvm-gadget/* 0640 root hardened-blikvm - -
