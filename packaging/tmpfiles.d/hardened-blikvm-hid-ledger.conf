# HID release ledger of the board owner: on tmpfs, so a key event costs a
# memory write instead of four synced writes on the card. Kept across an owner
# restart, not across a reboot (the USB gadget is recreated then, and the host
# sees nothing held). Installed by the operator together with the unit.
d /run/hardened-blikvm-hid 0700 root root - -
