# Type Path Mode User Group Age Argument
# The owner writes the video-engine settings the streamer unit reads. The file
# is world-readable on purpose so the unprivileged engine user can read it.
d /var/lib/hardened-blikvm-video 0755 root root - -
f /var/lib/hardened-blikvm-video/ustreamer.env 0644 root root - -
