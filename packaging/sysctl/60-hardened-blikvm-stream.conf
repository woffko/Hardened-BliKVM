# Hardened BliKVM: keep little unsent data queued in each TCP socket, so a
# video frame that a slower viewer cannot take yet waits in the server,
# where a newer frame replaces it, instead of in kernel buffers that let the
# picture fall seconds behind. Throughput is unchanged: data in flight is not
# limited, only the backlog not yet sent.
net.ipv4.tcp_notsent_lowat = 131072
