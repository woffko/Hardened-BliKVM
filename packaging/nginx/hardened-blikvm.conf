user www-data;
worker_processes 1;
pid /run/hardened-blikvm-nginx/nginx.pid;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    # Bounded runtime paths for every temp buffer nginx knows about: the
    # compiled-in defaults live under /var/lib/nginx, which the unit's
    # ProtectSystem=strict keeps read-only.
    client_body_temp_path /run/hardened-blikvm-nginx/client-temp;
    proxy_temp_path /run/hardened-blikvm-nginx/proxy-temp;
    fastcgi_temp_path /run/hardened-blikvm-nginx/fastcgi-temp;
    uwsgi_temp_path /run/hardened-blikvm-nginx/uwsgi-temp;
    scgi_temp_path /run/hardened-blikvm-nginx/scgi-temp;

    map $http_upgrade $hardened_blikvm_connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_host $hardened_blikvm_forwarded_host {
        default $http_host;
        ''      $host;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate /etc/hardened-blikvm/tls.crt;
        ssl_certificate_key /etc/hardened-blikvm/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # TLS 1.2 with forward secrecy and AEAD only (security review of
        # 2026-10-18, LOW-07); TLS 1.3 has its own suites.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:HardenedBliKVM:2m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        client_max_body_size 16m;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        # The page loads its own script, style, image and font files only and
        # talks to its own origin (HTTPS and secure WebSockets). Style
        # attributes are needed by the UI library; there is no eval and no
        # inline script. No block below may add a header of its own: nginx
        # would then drop these.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # Match the server's signed application archive bound (128 MiB).
        # Stream directly so authorization precedes receiving the entire body.
        location = /api/application-update/upload {
            client_max_body_size 128m;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # A signed RAW system bundle (8 GiB bound), streamed to the root
        # helper while the raw system update switch is on.
        location = /api/system-update/upload {
            client_max_body_size 8g;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # One 64 GiB image plus the server's 1 MiB multipart framing allowance.
        location = /api/download/file {
            client_max_body_size 65537m;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # The MJPEG stream comes over the server's unix socket: its buffer
        # stays small, so a slow viewer gets the newest frame, while a
        # loopback TCP receive buffer here grew to megabytes of old frames.
        location = /api/stream/mjpeg {
            proxy_pass http://unix:/run/hardened-blikvm-stream/mjpeg.sock:;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # The PicoClaw runtime's KVM tools answer only direct loopback calls.
        location ^~ /internal/ {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $hardened_blikvm_connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
