user www-data;
worker_processes 1;
pid /run/hardened-blikvm-nginx/nginx.pid;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    # Bounded runtime paths for every temp buffer nginx knows about: the
    # compiled-in defaults live under /var/lib/nginx, which the unit's
    # ProtectSystem=strict keeps read-only.
    client_body_temp_path /run/hardened-blikvm-nginx/client-temp;
    proxy_temp_path /run/hardened-blikvm-nginx/proxy-temp;
    fastcgi_temp_path /run/hardened-blikvm-nginx/fastcgi-temp;
    uwsgi_temp_path /run/hardened-blikvm-nginx/uwsgi-temp;
    scgi_temp_path /run/hardened-blikvm-nginx/scgi-temp;

    map $http_upgrade $hardened_blikvm_connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_host $hardened_blikvm_forwarded_host {
        default $http_host;
        ''      $host;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate /etc/hardened-blikvm/tls.crt;
        ssl_certificate_key /etc/hardened-blikvm/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:HardenedBliKVM:2m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        client_max_body_size 16m;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        # Match the server's signed application archive bound (128 MiB).
        # Stream directly so authorization precedes receiving the entire body.
        location = /api/application-update/upload {
            client_max_body_size 128m;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # A signed RAW system bundle (8 GiB bound), streamed to the root
        # helper while the raw system update switch is on.
        location = /api/system-update/upload {
            client_max_body_size 8g;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # One 4 GiB image plus the server's 1 MiB multipart framing allowance.
        location = /api/download/file {
            client_max_body_size 4097m;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # The PicoClaw runtime's KVM tools answer only direct loopback calls.
        location ^~ /internal/ {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $hardened_blikvm_forwarded_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $hardened_blikvm_connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
