map $http_upgrade $hardened_blikvm_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_host $hardened_blikvm_forwarded_host {
    default $http_host;
    ''      $host;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/hardened-blikvm/tls.crt;
    ssl_certificate_key /etc/hardened-blikvm/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HardenedBliKVM:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $hardened_blikvm_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hardened_blikvm_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
