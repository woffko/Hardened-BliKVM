[Service]
# Before every start nginx's configuration is the system's, with the HTTPS
# redirect the board's file has. A RAW update written by a board's older boot
# step carries the board's file over the new system's (code audit of
# 2026-10-20, gate Y). The list is given again so that the check below runs on
# the file nginx starts with; a failed step leaves the board's file.
ExecStartPre=
ExecStartPre=+/usr/bin/install -d -o www-data -g www-data -m 0700 /run/hardened-blikvm-nginx/client-temp /run/hardened-blikvm-nginx/proxy-temp /run/hardened-blikvm-nginx/fastcgi-temp /run/hardened-blikvm-nginx/uwsgi-temp /run/hardened-blikvm-nginx/scgi-temp
ExecStartPre=-+/usr/libexec/hardened-blikvm/bli-kvm-admin-helper --nginx-config
ExecStartPre=/usr/sbin/nginx -t -c /etc/hardened-blikvm/nginx.conf
