[Service]
# The control socket must be reachable by the unprivileged server user, so the
# owner keeps the shared service group; the socket takes its mode (0660)
# explicitly. What else the owner creates its group may read but not change
# (security review of 2026-10-18, MED-12). The system-action store sets the
# ownership of its journal copies explicitly instead of relying on this group.
Group=hardened-blikvm
UMask=0027
