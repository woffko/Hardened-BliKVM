[Unit]
# The board keeps /var/log on a RAM disk and points /var/log/journal at
# /var/log.hdd/journal, so journald starts writing to a dangling symlink when
# the SD-card filesystem is not mounted yet and the first boot records are
# lost. Requiring the mount keeps the early-boot journal on the card, which is
# what post-reboot forensics depend on.
RequiresMountsFor=/var/log.hdd
