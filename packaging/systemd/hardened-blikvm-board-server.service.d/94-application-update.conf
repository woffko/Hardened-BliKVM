# Restore the authenticated application-update surface on the running board
# server: the status, upload and activation sockets the retained supervisor
# listens on, plus the explicit write opt-in. The paths are the socket units'
# fixed ListenStream values.
[Service]
Environment=BLI_KVM_UPDATE_STATUS_SOCKET=/run/hardened-blikvm-update-api/status.sock
Environment=BLI_KVM_UPDATE_UPLOAD_SOCKET=/run/hardened-blikvm-update-api/upload.sock
Environment=BLI_KVM_UPDATE_ACTIVATION_SOCKET=/run/hardened-blikvm-update-api/activation.sock
Environment=BLI_KVM_UPDATE_WRITES_ENABLED=1
