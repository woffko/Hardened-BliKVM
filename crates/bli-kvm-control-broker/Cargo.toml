[package]
name = "bli-kvm-control-broker"
description = "Denied-by-default control policy broker for Hardened BliKVM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
network-write-profile = []
system-action-profile = ["dep:bli-kvm-system-action-policy", "dep:bli-kvm-system-action-store"]
atx-transition-profile = [
  "dep:bli-kvm-atx-policy",
  "dep:bli-kvm-atx-transition",
  "dep:bli-kvm-kvmd-atx-client",
  "dep:bli-kvm-kvmd-client",
  "bli-kvm-atx-policy/atx-reviewed-profile",
  "bli-kvm-atx-transition/kvmd-atx-profile",
]
hid-transition-profile = [
  "dep:bli-kvm-hid-adapter",
  "dep:bli-kvm-hid-policy",
  "dep:bli-kvm-hid-transition",
  "dep:bli-kvm-kvmd-client",
  "dep:bli-kvm-kvmd-hid-client",
  "dep:rand_core",
  "bli-kvm-hid-policy/hid-test-profile",
  "bli-kvm-hid-transition/kvmd-hid-profile",
]
media-transition-profile = [
  "dep:bli-kvm-media-catalog",
  "dep:bli-kvm-media-policy",
  "dep:bli-kvm-media-transition",
  "dep:bli-kvm-kvmd-client",
  "dep:bli-kvm-kvmd-media-client",
  "bli-kvm-media-policy/media-test-profile",
  "bli-kvm-media-transition/kvmd-media-profile",
]
chardev-atx-profile = [
  "gpio-atx-profile",
  "dep:bli-kvm-atx-gpio-executor",
  "dep:bli-kvm-platform-bli",
  "bli-kvm-atx-gpio-executor/chardev-driver",
]
gpio-atx-profile = [
  "dep:bli-kvm-atx-policy",
  "dep:bli-kvm-atx-transition",
  "bli-kvm-atx-policy/atx-reviewed-profile",
  "bli-kvm-atx-transition/gpio-atx-profile",
]
gadget-hid-profile = [
  "dep:bli-kvm-hid-adapter",
  "dep:bli-kvm-hid-policy",
  "dep:bli-kvm-hid-transition",
  "dep:rand_core",
  "bli-kvm-hid-policy/hid-test-profile",
  "bli-kvm-hid-transition/gadget-hid-profile",
]
gadget-media-profile = [
  "dep:bli-kvm-media-catalog",
  "dep:bli-kvm-media-policy",
  "dep:bli-kvm-media-transition",
  "dep:bli-kvm-usb-gadget",
  "bli-kvm-media-transition/gadget-media-profile",
  "bli-kvm-media-policy/media-test-profile",
]

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
bli-kvm-system-action-policy = { path = "../bli-kvm-system-action-policy", optional = true }
bli-kvm-system-action-store = { path = "../bli-kvm-system-action-store", optional = true }
bli-kvm-agent-protocol = { path = "../bli-kvm-agent-protocol" }
bli-kvm-atx-gpio-executor = { path = "../bli-kvm-atx-gpio-executor", optional = true }
bli-kvm-atx-policy = { path = "../bli-kvm-atx-policy", optional = true }
bli-kvm-atx-transition = { path = "../bli-kvm-atx-transition", optional = true, default-features = false }
bli-kvm-control-protocol = { path = "../bli-kvm-control-protocol" }
bli-kvm-core = { path = "../bli-kvm-core" }
bli-kvm-diagnostic-producer-client = { path = "../bli-kvm-diagnostic-producer-client" }
bli-kvm-diagnostic-protocol = { path = "../bli-kvm-diagnostic-protocol" }
bli-kvm-hid-adapter = { path = "../bli-kvm-hid-adapter", optional = true }
bli-kvm-hid-policy = { path = "../bli-kvm-hid-policy", optional = true }
bli-kvm-hid-transition = { path = "../bli-kvm-hid-transition", optional = true, default-features = false }
bli-kvm-kvmd-atx-client = { path = "../bli-kvm-kvmd-atx-client", optional = true }
bli-kvm-kvmd-client = { path = "../bli-kvm-kvmd-client", optional = true }
bli-kvm-kvmd-hid-client = { path = "../bli-kvm-kvmd-hid-client", optional = true }
bli-kvm-kvmd-media-client = { path = "../bli-kvm-kvmd-media-client", optional = true }
bli-kvm-media-catalog = { path = "../bli-kvm-media-catalog", optional = true }
bli-kvm-media-policy = { path = "../bli-kvm-media-policy", optional = true }
bli-kvm-media-transition = { path = "../bli-kvm-media-transition", optional = true, default-features = false }
bli-kvm-platform-bli = { path = "../bli-kvm-platform-bli", optional = true }
bli-kvm-usb-gadget = { path = "../bli-kvm-usb-gadget", optional = true }
rand_core = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
bli-kvm-control-client = { path = "../bli-kvm-control-client" }
tempfile.workspace = true
