[package]
name = "bli-kvm-hid-policy"
description = "Eligibility-gated HID control policy for Hardened BliKVM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
hid-test-profile = []

[dependencies]
bli-kvm-control-protocol = { path = "../bli-kvm-control-protocol" }
bli-kvm-core = { path = "../bli-kvm-core" }
bli-kvm-hid-adapter = { path = "../bli-kvm-hid-adapter" }
bli-kvm-hid-transition = { path = "../bli-kvm-hid-transition", default-features = false }

[dev-dependencies]
bli-kvm-hid-transition = { path = "../bli-kvm-hid-transition", features = ["kvmd-hid-profile"] }
bli-kvm-kvmd-client = { path = "../bli-kvm-kvmd-client" }
bli-kvm-kvmd-hid-client = { path = "../bli-kvm-kvmd-hid-client" }
tempfile.workspace = true
tokio.workspace = true
