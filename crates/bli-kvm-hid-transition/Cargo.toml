[package]
name = "bli-kvm-hid-transition"
description = "Lease-bound KVMD HID transition engine for Hardened BliKVM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bli-kvm-core = { path = "../bli-kvm-core" }
bli-kvm-hid-adapter = { path = "../bli-kvm-hid-adapter" }
bli-kvm-kvmd-client = { path = "../bli-kvm-kvmd-client", optional = true }
bli-kvm-kvmd-hid-client = { path = "../bli-kvm-kvmd-hid-client", optional = true }
bli-kvm-usb-gadget = { path = "../bli-kvm-usb-gadget", optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[features]
default = ["kvmd-hid-profile"]
kvmd-hid-profile = ["dep:bli-kvm-kvmd-client", "dep:bli-kvm-kvmd-hid-client"]
gadget-hid-profile = ["dep:bli-kvm-usb-gadget"]

[dev-dependencies]
tokio.workspace = true
