[package]
name = "bli-kvm-media-transition"
description = "Persisted virtual-media transition state machine for Hardened BliKVM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bli-kvm-core = { path = "../bli-kvm-core" }
bli-kvm-kvmd-client = { path = "../bli-kvm-kvmd-client", optional = true }
bli-kvm-kvmd-media-client = { path = "../bli-kvm-kvmd-media-client", optional = true }
bli-kvm-media-catalog = { path = "../bli-kvm-media-catalog" }
bli-kvm-media-policy = { path = "../bli-kvm-media-policy" }
bli-kvm-usb-gadget = { path = "../bli-kvm-usb-gadget", optional = true }
thiserror.workspace = true

[features]
default = ["kvmd-media-profile"]
kvmd-media-profile = ["dep:bli-kvm-kvmd-client", "dep:bli-kvm-kvmd-media-client"]
gadget-media-profile = ["dep:bli-kvm-usb-gadget"]

[dev-dependencies]
bli-kvm-media-policy = { path = "../bli-kvm-media-policy", features = ["media-test-profile"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
