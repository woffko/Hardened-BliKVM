[package]
name = "bli-kvm-atx-gpio-executor"
description = "GPIO-backed ATX pulse executor for Hardened BliKVM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bli-kvm-atx-transition = { path = "../bli-kvm-atx-transition", default-features = false }
bli-kvm-core = { path = "../bli-kvm-core" }
bli-kvm-gpio-chardev = { path = "../bli-kvm-gpio-chardev", optional = true }
bli-kvm-platform-bli = { path = "../bli-kvm-platform-bli" }
thiserror.workspace = true

[features]
chardev-driver = ["dep:bli-kvm-gpio-chardev"]
