[package]
name = "bli-kvm-server"
description = "Unprivileged BLi-KVM HTTP control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
restricted-control-surface = []

[dependencies]
argon2.workspace = true
axum.workspace = true
base64.workspace = true
bli-kvm-broker-client = { path = "../bli-kvm-broker-client" }
bli-kvm-control-client = { path = "../bli-kvm-control-client" }
bli-kvm-control-focus = { path = "../bli-kvm-control-focus" }
bli-kvm-control-protocol = { path = "../bli-kvm-control-protocol" }
bli-kvm-agent-protocol = { path = "../bli-kvm-agent-protocol" }
bli-kvm-admin-helper = { path = "../bli-kvm-admin-helper" }
bli-kvm-core = { path = "../bli-kvm-core" }
bli-kvm-media-catalog = { path = "../bli-kvm-media-catalog" }
bli-kvm-platform-bli = { path = "../bli-kvm-platform-bli" }
bli-kvm-quic-protocol = { path = "../bli-kvm-quic-protocol" }
bli-kvm-update-client = { path = "../bli-kvm-update-client" }
bli-kvm-update-protocol = { path = "../bli-kvm-update-protocol" }
bli-kvm-video-client = { path = "../bli-kvm-video-client" }
bytes.workspace = true
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
http-body.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
libc.workspace = true
nix.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
tower-http.workspace = true
http-body-util.workspace = true

[dev-dependencies]
bli-kvm-broker-protocol = { path = "../bli-kvm-broker-protocol" }
# The real gateway and a WebTransport client, for the transport's end-to-end test.
bli-kvm-quic-gateway = { path = "../bli-kvm-quic-gateway" }
wtransport = { version = "0.7.2", default-features = false, features = ["quinn", "ring", "self-signed"] }
tower.workspace = true
