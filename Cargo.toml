[workspace]
members = [
  "crates/bli-kvm-core",
  "crates/bli-kvm-control-protocol",
  "crates/bli-kvm-control-client",
  "crates/bli-kvm-control-broker",
  "crates/bli-kvm-control-focus",
  "crates/bli-kvm-hid-adapter",
  "crates/bli-kvm-hid-transition",
  "crates/bli-kvm-hid-policy",
  "crates/bli-kvm-hid-credential",
  "crates/bli-kvm-hid-isolated-gate",
  "crates/bli-kvm-atx-policy",
  "crates/bli-kvm-atx-transition",
  "crates/bli-kvm-atx-live-gate",
  "crates/bli-kvm-atx-gpio-executor",
  "crates/bli-kvm-atx-gpio-bench-gate",
  "crates/bli-kvm-gpio-chardev",
  "crates/bli-kvm-media-transition",
  "crates/bli-kvm-usb-gadget",
  "crates/bli-kvm-media-isolated-gate",
  "crates/bli-kvm-fan-policy",
  "crates/bli-kvm-fan-supervisor",
  "crates/bli-kvm-boardd",
  "crates/bli-kvm-serial-switch-codec",
  "crates/bli-kvm-st7789-model",
  "crates/bli-kvm-display-button-policy",
  "crates/bli-kvm-activity-led-policy",
  "crates/bli-kvm-diagnostic-export",
  "crates/bli-kvm-diagnostic-export-protocol",
  "crates/bli-kvm-diagnostic-export-client",
  "crates/bli-kvm-diagnostic-journal",
  "crates/bli-kvm-diagnostic-coordinator",
  "crates/bli-kvm-diagnostic-persistence",
  "crates/bli-kvm-diagnostic-persistence-gate",
  "crates/bli-kvm-diagnostic-store",
  "crates/bli-kvm-diagnostic-key-loader",
  "crates/bli-kvm-diagnostic-maintenance",
  "crates/bli-kvm-diagnostic-export-listener",
  "crates/bli-kvm-diagnostic-protocol",
  "crates/bli-kvm-diagnostic-producer-client",
  "crates/bli-kvm-diagnostic-collector-policy",
  "crates/bli-kvm-diagnostic-window-policy",
  "crates/bli-kvm-diagnostic-peer-policy",
  "crates/bli-kvm-diagnostic-peer-adapter",
  "crates/bli-kvm-diagnostic-collector",
  "crates/bli-kvm-media-catalog",
  "crates/bli-kvm-media-policy",
  "crates/bli-kvm-update-verifier",
  "crates/bli-kvm-system-image-verifier",
  "crates/bli-kvm-system-raw-update",
  "crates/bli-kvm-system-layout",
  "crates/bli-kvm-system-boot-control",
  "crates/bli-kvm-system-action-policy",
  "crates/bli-kvm-system-action-journal",
  "crates/bli-kvm-system-action-store",
  "crates/bli-kvm-system-action-maintenance",
  "crates/bli-kvm-recovery-inputs",
  "crates/bli-kvm-update-stager",
  "crates/bli-kvm-update-manager",
  "crates/bli-kvm-update-protocol",
  "crates/bli-kvm-update-client",
  "crates/bli-kvm-update-runtime",
  "crates/bli-kvm-update-supervisor",
  "crates/bli-kvm-update-health-reporter",
  "crates/bli-kvm-update-exec-helper",
  "crates/bli-kvm-admin-helper",
  "crates/bli-kvm-video-encoder",
  "crates/bli-kvm-ve-lab",
  "crates/bli-kvm-update-trust-config",
  "crates/bli-kvm-kvmd-media-client",
  "crates/bli-kvm-broker-protocol",
  "crates/bli-kvm-broker-client",
  "crates/bli-kvm-kvmd-client",
  "crates/bli-kvm-kvmd-hid-client",
  "crates/bli-kvm-kvmd-atx-client",
  "crates/bli-kvm-platform-bli",
  "crates/bli-kvm-platform-broker",
  "crates/bli-kvm-quic-protocol",
  "crates/bli-kvm-quic-gateway",
  "crates/bli-kvm-video-client",
  "crates/bli-kvm-video-proxy",
  "crates/bli-kvm-server",
]
exclude = ["tools/lsp-smoke/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/woffko/Hardened-BliKVM"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "http1", "tokio", "ws", "multipart"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
nix = { version = "0.30.1", default-features = false, features = ["user"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false }
signal-hook = "0.3.18"
subtle = { version = "2.6.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
zeroize = { version = "1.9.0", default-features = false }
