[workspace]
members = [
  "crates/bli-kvm-core",
  "crates/bli-kvm-control-protocol",
  "crates/bli-kvm-control-client",
  "crates/bli-kvm-control-broker",
  "crates/bli-kvm-hid-adapter",
  "crates/bli-kvm-hid-transition",
  "crates/bli-kvm-atx-policy",
  "crates/bli-kvm-media-catalog",
  "crates/bli-kvm-media-policy",
  "crates/bli-kvm-update-verifier",
  "crates/bli-kvm-update-stager",
  "crates/bli-kvm-kvmd-media-client",
  "crates/bli-kvm-broker-protocol",
  "crates/bli-kvm-broker-client",
  "crates/bli-kvm-kvmd-client",
  "crates/bli-kvm-kvmd-hid-client",
  "crates/bli-kvm-kvmd-atx-client",
  "crates/bli-kvm-platform-bli",
  "crates/bli-kvm-platform-broker",
  "crates/bli-kvm-video-client",
  "crates/bli-kvm-video-proxy",
  "crates/bli-kvm-server",
]
exclude = ["tools/lsp-smoke/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/woffko/Hardened-BliKVM"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "3.0.0", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
